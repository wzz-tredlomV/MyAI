name: Train and Test Model

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: 预训练
  # ============================================================
  pretrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow tqdm numpy

      - name: Check data files
        run: |
          echo "检查必要文件..."
          if [ ! -f "vocab.json" ]; then
            echo "❌ 找不到 vocab.json"
            exit 1
          fi
          if [ ! -d "corpus" ]; then
            echo "❌ 找不到 corpus 目录"
            exit 1
          fi
          echo "✅ 数据文件检查通过"

      - name: Create directories
        run: |
          mkdir -p saved_model
          mkdir -p predictions

      - name: Run pretraining
        run: |
          echo "========================================="
          echo "开始预训练 (预计50分钟)"
          echo "========================================="
          python pretrain.py

      - name: Check pretrain output
        run: |
          if [ -d "saved_model/pretrain_final" ]; then
            echo "✅ 预训练完成"
            ls -la saved_model/pretrain_final/
          else
            echo "❌ 预训练失败"
            exit 1
          fi

      # 预训练模型预测测试
      - name: Test pretrain model
        run: |
          echo "========================================="
          echo "测试预训练模型"
          echo "========================================="
          
          if [ -f "predict.py" ] && [ -f "vocab.json" ]; then
            echo "📝 测试1: 简单提示词"
            python predict.py \
              --model_path saved_model/pretrain_final \
              --prompt "Harry Potter" \
              --max_length 30 \
              --temperature 0.7 \
              --top_k 40 \
              --top_p 0.9 || echo "预测失败"
            
            echo ""
            echo "📝 测试2: 续写测试"
            python predict.py \
              --model_path saved_model/pretrain_final \
              --prompt "The magic wand" \
              --max_length 30 \
              --temperature 0.8 \
              --top_k 30 \
              --top_p 0.85 || echo "预测失败"
          else
            echo "⚠️ 跳过预测测试 (predict.py 或 vocab.json 不存在)"
          fi

      - name: Upload pretrain model
        uses: actions/upload-artifact@v4
        with:
          name: pretrain-model
          path: saved_model/pretrain_final/
          retention-days: 7

      - name: Upload pretrain predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretrain-predictions
          path: predictions/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # Job 2: SFT微调
  # ============================================================
  sft:
    needs: pretrain
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow tqdm numpy

      - name: Download pretrain model
        uses: actions/download-artifact@v4
        with:
          name: pretrain-model
          path: saved_model/pretrain_final/

      - name: Check model and data
        run: |
          if [ ! -d "saved_model/pretrain_final" ]; then
            echo "❌ 预训练模型下载失败"
            exit 1
          fi
          if [ ! -f "sft_train.jsonl" ]; then
            echo "❌ 找不到 sft_train.jsonl"
            exit 1
          fi
          echo "✅ 检查通过"
          mkdir -p predictions

      - name: Run SFT training
        run: |
          echo "========================================="
          echo "开始SFT微调 (预计4小时)"
          echo "========================================="
          python sft_train.py

      - name: Check SFT output
        run: |
          if [ -d "saved_model/sft_final" ]; then
            echo "✅ SFT完成"
            ls -la saved_model/sft_final/
          else
            echo "❌ SFT失败"
            exit 1
          fi

      # SFT模型预测测试（更丰富的测试）
      - name: Test SFT model
        run: |
          echo "========================================="
          echo "测试SFT模型"
          echo "========================================="
          
          if [ -f "predict.py" ] && [ -f "vocab.json" ]; then
            # 测试1: 简单问答
            echo "📝 测试1: 简单问答"
            python predict.py \
              --model_path saved_model/sft_final \
              --prompt "What is the capital of France?" \
              --max_length 30 \
              --temperature 0.7 \
              --top_k 40 \
              --top_p 0.9 || echo "预测失败"
            
            # 测试2: 哈利波特相关问题
            echo ""
            echo "📝 测试2: 哈利波特问题"
            python predict.py \
              --model_path saved_model/sft_final \
              --prompt "Who is Harry Potter?" \
              --max_length 50 \
              --temperature 0.8 \
              --top_k 30 \
              --top_p 0.85 || echo "预测失败"
            
            # 测试3: 长文本生成
            echo ""
            echo "📝 测试3: 故事续写"
            python predict.py \
              --model_path saved_model/sft_final \
              --prompt "Once upon a time" \
              --max_length 60 \
              --temperature 0.9 \
              --top_k 50 \
              --top_p 0.95 \
              --beam_width 3 || echo "预测失败"
            
            # 测试4: 上下文相关
            echo ""
            echo "📝 测试4: 上下文问题"
            python predict.py \
              --model_path saved_model/sft_final \
              --prompt "Question: What is the largest planet in our solar system?" \
              --max_length 30 \
              --temperature 0.6 \
              --top_k 20 \
              --top_p 0.9 || echo "预测失败"
          else
            echo "⚠️ 跳过预测测试"
          fi

      - name: Upload SFT model
        uses: actions/upload-artifact@v4
        with:
          name: sft-model
          path: saved_model/sft_final/
          retention-days: 7

      - name: Upload SFT predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sft-predictions
          path: predictions/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # Job 3: DPO强化学习
  # ============================================================
  dpo:
    needs: sft
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow tqdm numpy

      - name: Download SFT model
        uses: actions/download-artifact@v4
        with:
          name: sft-model
          path: saved_model/sft_final/

      - name: Check model and data
        run: |
          if [ ! -d "saved_model/sft_final" ]; then
            echo "❌ SFT模型下载失败"
            exit 1
          fi
          if [ ! -f "rl_train.jsonl" ]; then
            echo "❌ 找不到 rl_train.jsonl"
            exit 1
          fi
          echo "✅ 检查通过"
          mkdir -p predictions

      - name: Run DPO training
        run: |
          echo "========================================="
          echo "开始DPO强化学习 (预计1.5小时)"
          echo "========================================="
          python dpo_train.py

      - name: Check DPO output
        run: |
          if [ -d "saved_model/rl_final" ]; then
            echo "✅ DPO完成"
            ls -la saved_model/rl_final/
          else
            echo "❌ DPO失败"
            exit 1
          fi

      # DPO模型预测测试（最终模型测试）
      - name: Test DPO model
        run: |
          echo "========================================="
          echo "测试DPO模型 (最终模型)"
          echo "========================================="
          
          if [ -f "predict.py" ] && [ -f "vocab.json" ]; then
            # 测试1: 综合测试
            echo "📝 测试1: 综合问答"
            python predict.py \
              --model_path saved_model/rl_final \
              --prompt "What is the meaning of life?" \
              --max_length 40 \
              --temperature 0.8 \
              --top_k 50 \
              --top_p 0.9 || echo "预测失败"
            
            # 测试2: 知识问答
            echo ""
            echo "📝 测试2: 知识问答"
            python predict.py \
              --model_path saved_model/rl_final \
              --prompt "Who wrote the novel Pride and Prejudice?" \
              --max_length 30 \
              --temperature 0.6 \
              --top_k 30 \
              --top_p 0.85 || echo "预测失败"
            
            # 测试3: 创意生成（高温度）
            echo ""
            echo "📝 测试3: 创意生成"
            python predict.py \
              --model_path saved_model/rl_final \
              --prompt "In the future, AI will" \
              --max_length 50 \
              --temperature 1.0 \
              --top_k 60 \
              --top_p 0.95 || echo "预测失败"
            
            # 测试4: 束搜索
            echo ""
            echo "📝 测试4: 束搜索优化"
            python predict.py \
              --model_path saved_model/rl_final \
              --prompt "The best way to learn is" \
              --max_length 40 \
              --temperature 0.7 \
              --top_k 30 \
              --top_p 0.9 \
              --beam_width 3 || echo "预测失败"
            
            # 测试5: 简短回答
            echo ""
            echo "📝 测试5: 简短回答"
            python predict.py \
              --model_path saved_model/rl_final \
              --prompt "Hello" \
              --max_length 20 \
              --temperature 0.5 \
              --top_k 10 \
              --top_p 0.8 || echo "预测失败"
          else
            echo "⚠️ 跳过预测测试"
          fi

      - name: Upload DPO model
        uses: actions/upload-artifact@v4
        with:
          name: dpo-model
          path: saved_model/rl_final/
          retention-days: 7

      - name: Upload DPO predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpo-predictions
          path: predictions/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # Job 4: 打包所有模型和预测结果
  # ============================================================
  package:
    needs: [pretrain, sft, dpo]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded/

      - name: Package everything
        run: |
          echo "========================================="
          echo "打包所有模型和预测结果"
          echo "========================================="
          
          mkdir -p final_package/models
          mkdir -p final_package/predictions
          mkdir -p final_package/logs
          
          # 复制模型
          if [ -d "downloaded/pretrain-model" ]; then
            cp -r downloaded/pretrain-model final_package/models/pretrain_final
            echo "✅ 预训练模型已打包"
          fi
          
          if [ -d "downloaded/sft-model" ]; then
            cp -r downloaded/sft-model final_package/models/sft_final
            echo "✅ SFT模型已打包"
          fi
          
          if [ -d "downloaded/dpo-model" ]; then
            cp -r downloaded/dpo-model final_package/models/rl_final
            echo "✅ DPO模型已打包"
          fi
          
          # 复制预测结果
          if [ -d "downloaded/pretrain-predictions" ] && [ "$(ls -A downloaded/pretrain-predictions)" ]; then
            cp -r downloaded/pretrain-predictions/* final_package/predictions/pretrain/ 2>/dev/null || echo "无预测结果"
            echo "✅ 预训练预测结果已打包"
          fi
          
          if [ -d "downloaded/sft-predictions" ] && [ "$(ls -A downloaded/sft-predictions)" ]; then
            cp -r downloaded/sft-predictions/* final_package/predictions/sft/ 2>/dev/null || echo "无预测结果"
            echo "✅ SFT预测结果已打包"
          fi
          
          if [ -d "downloaded/dpo-predictions" ] && [ "$(ls -A downloaded/dpo-predictions)" ]; then
            cp -r downloaded/dpo-predictions/* final_package/predictions/dpo/ 2>/dev/null || echo "无预测结果"
            echo "✅ DPO预测结果已打包"
          fi
          
          # 复制配置文件
          if [ -f "vocab.json" ]; then
            cp vocab.json final_package/
          fi
          
          if [ -f "predict.py" ]; then
            cp predict.py final_package/
          fi
          
          # 创建详细的README
          cat > final_package/README.md << 'EOF'
          # 🎯 训练完成的模型 + 预测结果

          ## 📦 模型列表
          | 模型 | 路径 | 说明 |
          |------|------|------|
          | 预训练模型 | `models/pretrain_final/` | 哈利波特语料预训练 |
          | SFT模型 | `models/sft_final/` | SQuAD数据微调 |
          | DPO模型 | `models/rl_final/` | DPO强化学习优化 |

          ## 📊 预测结果
          - `predictions/pretrain/` - 预训练模型预测结果
          - `predictions/sft/` - SFT模型预测结果
          - `predictions/dpo/` - DPO模型预测结果

          ## 🚀 快速开始

          ### 使用SFT模型
          ```bash
          python predict.py --model_path models/sft_final --prompt "Your question"
          ```

          ### 使用DPO模型（推荐）
          ```bash
          python predict.py --model_path models/rl_final --prompt "Your question"
          ```

          ### 交互模式
          ```bash
          python predict.py --interactive --model_path models/sft_final
          ```

          ### 批处理模式
          ```bash
          python predict.py --model_path models/rl_final --batch prompts.txt
          ```

          ## 📈 训练配置
          - 词汇表大小: 3000
          - 嵌入维度: 384
          - 注意力头数: 6
          - 层数: 6
          - 序列长度: 256
          - SFT学习率: 1e-6
          - DPO学习率: 1e-7

          ## 📝 测试提示词
          预测测试使用了以下提示词：
          1. 简单问答: "What is the capital of France?"
          2. 哈利波特: "Who is Harry Potter?"
          3. 创意生成: "Once upon a time"
          4. 知识问答: "Who wrote Pride and Prejudice?"
          5. 未来展望: "In the future, AI will"
          6. 简短回答: "Hello"

          ## 💡 建议
          1. 如果追求准确度，使用SFT模型
          2. 如果追求创意和多样性，使用DPO模型
          3. 可以尝试不同的temperature参数 (0.5-1.0)
          4. 使用beam_search可以获得更连贯的文本

          ## 系统要求
          - Python 3.10+
          - TensorFlow 2.15+
          - 4GB+ RAM
          EOF

          # 创建预测结果汇总
          cat > final_package/predictions/SUMMARY.md << 'EOF'
          # 预测结果汇总

          此文件夹包含各模型在不同提示词下的预测结果。

          ## 测试方法
          每个模型都使用相同的测试集进行预测，以对比效果。

          ## 结果说明
          - 预训练模型: 基础能力，可能不够流畅
          - SFT模型: 更准确的问答能力
          - DPO模型: 更自然的对话能力

          ## 建议
          对比查看各模型的输出，选择最适合您需求的模型。
          EOF

          # 打包
          tar -czf complete_package.tar.gz final_package/
          echo ""
          echo "========================================="
          echo "✅ 打包完成: complete_package.tar.gz"
          echo "========================================="
          echo "文件大小: $(du -sh complete_package.tar.gz | cut -f1)"
          echo ""
          echo "目录结构:"
          tree final_package/ 2>/dev/null || find final_package/ -type f | head -30

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: complete-package
          path: complete_package.tar.gz
          retention-days: 30

      - name: Upload unpacked files
        uses: actions/upload-artifact@v4
        with:
          name: final-package-unpacked
          path: final_package/
          retention-days: 30

      - name: Show final summary
        run: |
          echo "========================================="
          echo "🎉 所有任务完成！"
          echo "========================================="
          echo ""
          echo "📦 下载 complete-package 包含:"
          echo "  - complete_package.tar.gz (所有模型+预测结果)"
          echo ""
          echo "📁 下载 final-package-unpacked 包含:"
          echo "  - models/  (所有模型文件夹)"
          echo "  - predictions/ (所有预测结果)"
          echo "  - vocab.json (词汇表)"
          echo "  - predict.py (预测脚本)"
          echo "  - README.md (完整说明)"
          echo ""
          echo "🔍 预测测试已完成:"
          echo "  - 预训练模型: 2个测试"
          echo "  - SFT模型: 4个测试"
          echo "  - DPO模型: 5个测试"
          echo "========================================="