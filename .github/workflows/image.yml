name: AI Image Generator (High Quality) + Daily Cleanup

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '图片描述 (Prompt)'
        required: true
        default: 'a cute cat sitting on a chair'
        type: string
      steps:
        description: '推理步数 (越多越精细)'
        required: false
        default: '30'
        type: choice
        options: ['20', '30', '40', '50']
      resolution:
        description: '图片分辨率'
        required: false
        default: '768'
        type: choice
        options: ['512', '768', '1024']
  schedule:
    - cron: '0 0 * * *'

jobs:
  generate-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 强制清理 HuggingFace 缓存
        run: |
          rm -rf ~/.cache/huggingface/hub/
          mkdir -p ~/.cache/huggingface/hub/
          echo "✅ 缓存目录已重置"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev

      - name: 安装 Python 依赖
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate pillow

      - name: 生成高清图片
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          STEPS: ${{ github.event.inputs.steps }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
        run: |
          python << 'PYTHON'
          import torch
          from diffusers import StableDiffusionPipeline, EulerAncestralDiscreteScheduler
          import base64
          from io import BytesIO
          import os

          prompt = os.environ.get('PROMPT', 'a cute cat')
          steps = int(os.environ.get('STEPS', '30'))
          resolution = int(os.environ.get('RESOLUTION', '768'))
          
          model_id = "CompVis/stable-diffusion-v1-4"
          cache_dir = os.path.expanduser("~/.cache/huggingface/hub/")
          
          print(f"📦 加载模型... 分辨率: {resolution}x{resolution}")
          pipe = StableDiffusionPipeline.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
              safety_checker=None,
              cache_dir=cache_dir
          )
          pipe = pipe.to("cpu")
          
          # 使用高质量采样器
          pipe.scheduler = EulerAncestralDiscreteScheduler.from_config(pipe.scheduler.config)
          
          print("✅ 模型加载完成，生成中...")
          image = pipe(
              prompt, 
              num_inference_steps=steps,
              width=resolution,
              height=resolution,
              guidance_scale=7.5
          ).images[0]

          buffer = BytesIO()
          image.save(buffer, format="PNG")
          img_base64 = base64.b64encode(buffer.getvalue()).decode()
          with open('image_base64.txt', 'w') as f:
              f.write(img_base64)
          print("✅ 高清图片生成完成！")
          PYTHON

      - name: 上传图片到 PythonAnywhere
        env:
          PY_UPLOAD_TOKEN: ${{ secrets.PY_UPLOAD_TOKEN }}
        run: |
          echo "$(cat image_base64.txt)" | base64 -d > generated_image.png
          curl -s -X POST \
            -H "Authorization: Bearer $PY_UPLOAD_TOKEN" \
            -F "file=@generated_image.png" \
            https://wzzresurgam.pythonanywhere.com/api/upload
          echo "✅ 图片已上传"

  cleanup-images:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: 调用 PythonAnywhere 清理接口
        env:
          PY_UPLOAD_TOKEN: ${{ secrets.PY_UPLOAD_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $PY_UPLOAD_TOKEN" \
            https://wzzresurgam.pythonanywhere.com/api/cleanup
          echo "✅ 清理完成"