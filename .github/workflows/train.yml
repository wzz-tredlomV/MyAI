name: Train Literature Model

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      skip_pretrain:
        description: '跳过预训练（使用已有模型）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sft_epochs:
        description: 'SFT训练轮数'
        required: false
        default: '20'
        type: string
      rl_epochs:
        description: 'RL训练轮数'
        required: false
        default: '15'
        type: string
  
  # 推送到 main 分支时触发（可选）
  # push:
  #   branches: [ main, master ]

jobs:
  train:
    runs-on: ubuntu-latest
    
    # GitHub Actions 最大 6 小时，设置超时
    timeout-minutes: 360
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow tqdm numpy
      
      # 4. 显示目录结构（调试用）
      - name: Show directory structure
        run: |
          echo "当前目录:"
          ls -la
          echo ""
          echo "语料目录 (corpus/):"
          ls -la corpus/ 2>/dev/null || echo "  不存在"
          echo ""
          echo "数据文件:"
          ls -la *.jsonl 2>/dev/null || echo "  没有 jsonl 文件"
          echo ""
          echo "词汇表:"
          ls -la vocab.json 2>/dev/null || echo "  不存在"
      
      # 5. 检查必要文件
      - name: Check required files
        run: |
          echo "检查必要文件..."
          
          # 检查词汇表
          if [ -f "vocab.json" ]; then
            echo "✅ vocab.json 存在"
            echo "  词汇表大小: $(python -c "import json; print(len(json.load(open('vocab.json'))))")"
          else
            echo "❌ vocab.json 不存在！"
            exit 1
          fi
          
          # 检查语料目录
          if [ -d "corpus" ] && [ "$(ls -A corpus/)" ]; then
            echo "✅ corpus/ 目录存在且非空"
            echo "  文件列表: $(ls corpus/)"
          else
            echo "❌ corpus/ 目录为空或不存在！"
            exit 1
          fi
          
          # 检查 SFT 数据
          if [ -f "sft_train.jsonl" ]; then
            echo "✅ sft_train.jsonl 存在"
            echo "  数据量: $(wc -l < sft_train.jsonl) 条"
          else
            echo "⚠️ sft_train.jsonl 不存在（SFT微调将被跳过）"
          fi
          
          # 检查 RL 数据
          if [ -f "rl_train.jsonl" ]; then
            echo "✅ rl_train.jsonl 存在"
            echo "  数据量: $(wc -l < rl_train.jsonl) 条"
          else
            echo "⚠️ rl_train.jsonl 不存在（DPO训练将被跳过）"
          fi
      
      # 6. 创建必要目录
      - name: Create directories
        run: |
          mkdir -p saved_model
          mkdir -p output
          mkdir -p checkpoints
      
      # 7. 运行训练
      - name: Run training
        run: |
          echo "=========================================="
          echo "开始训练..."
          echo "=========================================="
          
          # 如果手动触发，可以覆盖 epochs
          if [ "${{ github.event.inputs.sft_epochs }}" != "" ] && [ "${{ github.event.inputs.sft_epochs }}" != "20" ]; then
            echo "使用自定义 SFT epochs: ${{ github.event.inputs.sft_epochs }}"
            export SFT_EPOCHS="${{ github.event.inputs.sft_epochs }}"
          fi
          
          if [ "${{ github.event.inputs.rl_epochs }}" != "" ] && [ "${{ github.event.inputs.rl_epochs }}" != "15" ]; then
            echo "使用自定义 RL epochs: ${{ github.event.inputs.rl_epochs }}"
            export RL_EPOCHS="${{ github.event.inputs.rl_epochs }}"
          fi
          
          # 运行训练
          python train.py
          
          echo ""
          echo "训练完成！"
      
      # 8. 检查训练结果
      - name: Check training results
        run: |
          echo "=========================================="
          echo "检查训练结果..."
          echo "=========================================="
          
          echo "saved_model/ 目录内容:"
          ls -la saved_model/
          
          echo ""
          echo "模型文件:"
          find saved_model/ -name "model.keras" -type f | while read f; do
            size=$(du -h "$f" | cut -f1)
            echo "  ✅ $f ($size)"
          done
          
          echo ""
          echo "配置文件:"
          find saved_model/ -name "config.json" -type f | while read f; do
            echo "  ✅ $f"
          done
      
      # 9. 运行预测测试（如果有模型）
      - name: Run prediction test
        run: |
          echo "=========================================="
          echo "运行预测测试..."
          echo "=========================================="
          
          # 测试 SFT 模型
          if [ -f "saved_model/sft_final/model.keras" ]; then
            echo "✅ 测试 SFT 模型..."
            python predict.py \
              --model_path saved_model/sft_final \
              --prompt "What is the capital of France?" \
              --max_length 50 \
              --temperature 0.8 \
              --top_k 50 \
              --top_p 0.9 || echo "⚠️ SFT 预测失败"
          else
            echo "⚠️ SFT 模型不存在，跳过预测"
          fi
          
          # 测试 RL 模型
          if [ -f "saved_model/rl_final/model.keras" ]; then
            echo ""
            echo "✅ 测试 RL 模型..."
            python predict.py \
              --model_path saved_model/rl_final \
              --prompt "Who wrote Harry Potter?" \
              --max_length 50 \
              --temperature 0.9 \
              --top_k 30 \
              --top_p 0.95 || echo "⚠️ RL 预测失败"
          else
            echo "⚠️ RL 模型不存在，跳过预测"
          fi
      
      # 10. 整理输出文件
      - name: Organize output
        run: |
          echo "整理输出文件..."
          
          mkdir -p output/models
          mkdir -p output/checkpoints
          
          # 复制模型
          if [ -d "saved_model" ]; then
            cp -r saved_model/* output/models/ 2>/dev/null || echo "没有模型文件"
          fi
          
          # 复制配置文件
          if [ -f "vocab.json" ]; then
            cp vocab.json output/
          fi
          
          # 复制数据文件
          cp sft_train.jsonl output/ 2>/dev/null || echo "没有SFT数据"
          cp sft_val.jsonl output/ 2>/dev/null || echo "没有SFT验证数据"
          cp rl_train.jsonl output/ 2>/dev/null || echo "没有RL数据"
          cp rl_val.jsonl output/ 2>/dev/null || echo "没有RL验证数据"
          
          # 创建说明文件
          cat > output/README.md << 'EOF'
          # 训练输出
          
          ## 模型文件
          - `models/pretrain_final/` - 预训练模型
          - `models/sft_final/` - SFT微调模型
          - `models/rl_final/` - DPO强化学习模型
          
          ## 配置文件
          - `vocab.json` - 词汇表
          
          ## 数据文件
          - `sft_train.jsonl` - SFT训练数据
          - `rl_train.jsonl` - RL训练数据
          
          ## 使用示例
          ```bash
          python predict.py --model_path models/sft_final --prompt "你的问题"
          ```
          EOF
          
          echo "✅ 输出已整理到 output/"
      
      # 11. 上传模型文件（Artifact）
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            output/
            saved_model/
            vocab.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
      
      # 12. 上传训练日志
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: |
            *.log
            *.txt
            saved_model/*.log
          if-no-files-found: ignore
          retention-days: 7
      
      # 13. 显示磁盘使用情况
      - name: Show disk usage
        if: always()
        run: |
          echo "磁盘使用情况:"
          df -h
          echo ""
          echo "模型目录大小:"
          du -sh saved_model/ 2>/dev/null || echo "  不存在"
          echo ""
          echo "输出目录大小:"
          du -sh output/ 2>/dev/null || echo "  不存在"
      
      # 14. 完成通知
      - name: Done
        if: always()
        run: |
          echo "=========================================="
          echo "✅ GitHub Actions 运行完成！"
          echo "=========================================="
          
          if [ -d "output/models" ]; then
            echo "📦 模型已保存到 Artifacts:"
            echo "   - trained-model.zip"
            echo ""
            echo "📂 下载后解压即可使用："
            echo "   unzip trained-model.zip"
            echo "   cd output/"
            echo "   python ../predict.py --model_path models/sft_final --prompt \"Hello\""
          else
            echo "⚠️ 没有生成模型文件"
          fi