name: AI Image Generator + Daily Cleanup

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '图片描述 (Prompt)'
        required: true
        default: 'a cute cat sitting on a chair'
        type: string
      steps:
        description: '推理步数'
        required: false
        default: '20'
        type: choice
        options: ['10', '20', '30', '50']
  schedule:
    - cron: '0 0 * * *'

jobs:
  generate-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 HuggingFace 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/
          key: ${{ runner.os }}-huggingface-v1-4
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: 清理 HuggingFace 缓存（修复符号链接错误）
        run: |
          rm -rf ~/.cache/huggingface/hub/models--CompVis--stable-diffusion-v1-4
          echo "✅ 已清理旧缓存"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev

      - name: 安装 Python 依赖
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate pillow

      - name: 生成图片
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          STEPS: ${{ github.event.inputs.steps }}
        run: |
          python << 'PYTHON'
          import torch
          from diffusers import StableDiffusionPipeline, DDIMScheduler
          import base64
          from io import BytesIO
          import os

          prompt = os.environ.get('PROMPT', 'a cute cat')
          steps = int(os.environ.get('STEPS', '20'))

          model_id = "CompVis/stable-diffusion-v1-4"
          pipe = StableDiffusionPipeline.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
              safety_checker=None,
              cache_dir="~/.cache/huggingface/hub/"
          )
          pipe = pipe.to("cpu")
          pipe.scheduler = DDIMScheduler.from_config(pipe.scheduler.config)

          image = pipe(prompt, num_inference_steps=steps).images[0]

          buffer = BytesIO()
          image.save(buffer, format="PNG")
          img_base64 = base64.b64encode(buffer.getvalue()).decode()
          with open('image_base64.txt', 'w') as f:
              f.write(img_base64)
          PYTHON

      - name: 上传图片到 PythonAnywhere
        env:
          PY_UPLOAD_TOKEN: ${{ secrets.PY_UPLOAD_TOKEN }}
        run: |
          echo "$(cat image_base64.txt)" | base64 -d > generated_image.png
          curl -s -X POST \
            -H "Authorization: Bearer $PY_UPLOAD_TOKEN" \
            -F "file=@generated_image.png" \
            https://wzzresurgam.pythonanywhere.com/api/upload

  cleanup-images:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: 调用 PythonAnywhere 清理接口
        env:
          PY_UPLOAD_TOKEN: ${{ secrets.PY_UPLOAD_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $PY_UPLOAD_TOKEN" \
            https://wzzresurgam.pythonanywhere.com/api/cleanup