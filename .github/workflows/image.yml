name: Deploy Image Generation AI (CPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '图片描述（Prompt）'
        required: true
        default: 'a cute cat sitting on a chair'
        type: string
      steps:
        description: '推理步数'
        required: false
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '30'
          - '50'

jobs:
  generate-image:
    runs-on: ubuntu-latest

    steps:
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 HuggingFace 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/
          key: ${{ runner.os }}-huggingface-v1-4-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate pillow

      - name: 生成图片
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          STEPS: ${{ github.event.inputs.steps }}
        run: |
          echo "=========================================="
          echo "🎨 开始生成图片 (使用 Stable Diffusion v1-4)"
          echo "=========================================="
          echo "提示词: $PROMPT"
          echo "推理步数: $STEPS"
          echo "=========================================="
          
          python << 'PYTHON'
          import torch
          from diffusers import StableDiffusionPipeline, DDIMScheduler
          import base64
          from io import BytesIO
          import os
          
          prompt = os.environ.get('PROMPT', 'a cute cat')
          steps = int(os.environ.get('STEPS', '20'))
          
          model_id = "CompVis/stable-diffusion-v1-4"
          
          print("📦 加载模型...")
          pipe = StableDiffusionPipeline.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
              safety_checker=None,
              cache_dir="~/.cache/huggingface/hub/"  # 显式指定缓存目录
          )
          pipe = pipe.to("cpu")
          pipe.scheduler = DDIMScheduler.from_config(pipe.scheduler.config)
          
          print("✅ 模型加载完成，开始生成图片...")
          image = pipe(prompt, num_inference_steps=steps).images[0]
          
          buffer = BytesIO()
          image.save(buffer, format="PNG")
          img_base64 = base64.b64encode(buffer.getvalue()).decode()
          
          with open('image_base64.txt', 'w') as f:
              f.write(img_base64)
          
          data_url = f"data:image/png;base64,{img_base64}"
          with open('data_url.txt', 'w') as f:
              f.write(data_url)
          
          print("✅ 图片生成完成！")
          PYTHON

      - name: 显示 Base64 到日志
        run: cat image_base64.txt

      - name: 显示 Data URL
        run: cat data_url.txt

      - name: 添加到 Job Summary
        run: |
          python << 'EOF'
          import os
          with open('data_url.txt', 'r') as f:
              data_url = f.read()
          prompt = os.environ.get('PROMPT', 'a cute cat')
          steps = os.environ.get('STEPS', '20')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## 🎨 生成的图片\n\n")
              summary.write(f"**提示词:** {prompt}\n\n")
              summary.write(f"**推理步数:** {steps}\n\n")
              summary.write(f'<img src="{data_url}" width="512" alt="Generated Image">\n\n')
          EOF
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          STEPS: ${{ github.event.inputs.steps }}

      - name: 上传 Base64 文件（备用）
        uses: actions/upload-artifact@v4
        with:
          name: generated-image-base64
          path: image_base64.txt data_url.txt