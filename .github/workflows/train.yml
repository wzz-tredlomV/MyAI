name: Train Model

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  train:
    runs-on: ubuntu-latest
    
    # 设置超时时间（训练可能需要较长时间）
    timeout-minutes: 360  # 6小时

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow tqdm numpy
          
      # 4. 检查数据文件是否存在
      - name: Check data files
        run: |
          echo "检查必要文件..."
          ls -la
          if [ ! -f "vocab.json" ]; then
            echo "警告: vocab.json 不存在"
          fi
          if [ ! -d "corpus" ]; then
            echo "警告: corpus 目录不存在"
          fi
          if [ ! -f "predict.py" ]; then
            echo "警告: predict.py 不存在"
          fi
          
      # 5. 创建必要的目录
      - name: Create directories
        run: |
          mkdir -p saved_model
          mkdir -p output
          mkdir -p checkpoints
          
      # 6. 运行训练脚本
      - name: Run training
        run: |
          echo "开始训练..."
          python train.py || echo "训练完成或中断"
          
      # 7. 检查生成的文件
      - name: Check generated files
        run: |
          echo "检查生成的文件..."
          ls -la saved_model/ || echo "saved_model 目录不存在"
          echo "查找模型文件..."
          find saved_model/ -name "*.keras" -o -name "*.json" -o -name "*.h5" | head -20
          
      # 8. 运行预测测试（使用SFT模型）
      - name: Run prediction test with SFT model
        id: predict_sft
        run: |
          echo "========================================="
          echo "运行预测测试 (SFT模型)"
          echo "========================================="
          
          # 检查SFT模型是否存在
          if [ -d "saved_model/sft_final" ] && [ -f "saved_model/sft_final/model.keras" ]; then
            echo "✓ 找到SFT模型，开始预测..."
            
            # 运行预测
            python predict.py \
              --model_path saved_model/sft_final \
              --prompt "你好。" \
              --max_length 100 \
              --temperature 0.8 \
              --top_k 50 \
              --top_p 0.9
            
            echo "✓ SFT模型预测完成"
          else
            echo "⚠ SFT模型不存在，跳过预测"
            echo "可用的模型目录:"
            ls -la saved_model/ || echo "无"
          fi
          
      # 9. 运行预测测试（使用RL模型，如果存在）
      - name: Run prediction test with RL model
        id: predict_rl
        run: |
          echo "========================================="
          echo "运行预测测试 (RL模型)"
          echo "========================================="
          
          # 检查RL模型是否存在
          if [ -d "saved_model/rl_final" ] && [ -f "saved_model/rl_final/model.keras" ]; then
            echo "✓ 找到RL模型，开始预测..."
            
            # 运行预测
            python predict.py \
              --model_path saved_model/rl_final \
              --prompt "床前明月光" \
              --max_length 150 \
              --temperature 0.9 \
              --top_k 30 \
              --top_p 0.95
            
            echo "✓ RL模型预测完成"
          else
            echo "⚠ RL模型不存在，跳过预测"
          fi
          
      # 10. 运行交互模式测试（使用预训练模型）
      - name: Run prediction test with Pretrain model
        id: predict_pretrain
        run: |
          echo "========================================="
          echo "运行预测测试 (预训练模型)"
          echo "========================================="
          
          # 检查预训练模型是否存在
          if [ -d "saved_model/pretrain_final" ] && [ -f "saved_model/pretrain_final/model.keras" ]; then
            echo "✓ 找到预训练模型，开始预测..."
            
            # 运行预测
            python predict.py \
              --model_path saved_model/pretrain_final \
              --prompt "春眠不觉晓" \
              --max_length 80 \
              --temperature 0.7 \
              --top_k 40
            
            echo "✓ 预训练模型预测完成"
          else
            echo "⚠ 预训练模型不存在，跳过预测"
          fi
          
      # 11. 保存预测结果到文件
      - name: Save prediction results
        run: |
          echo "保存预测结果..."
          
          # 创建预测结果目录
          mkdir -p output/predictions
          
          # 如果有预测输出，保存到文件
          if [ -f "generated_results.txt" ]; then
            cp generated_results.txt output/predictions/
            echo "✓ 预测结果已保存"
          fi
          
          # 创建预测结果摘要
          cat > output/predictions/prediction_summary.md << 'EOF'
          # 模型预测测试结果
          
          ## 测试的模型
          - SFT模型 (saved_model/sft_final)
          - RL模型 (saved_model/rl_final) 
          - 预训练模型 (saved_model/pretrain_final)
          
          ## 测试提示词
          - "你好。" 
          - "床前明月光"
          - "春眠不觉晓"
          
          ## 结果说明
          以上是各模型在测试提示词下的生成结果。
          具体生成文本请查看日志输出。
          EOF
          
      # 12. 整理输出文件到output目录
      - name: Organize output files
        run: |
          echo "整理输出文件..."
          
          # 创建output目录结构
          mkdir -p output/models
          mkdir -p output/checkpoints
          mkdir -p output/logs
          mkdir -p output/predictions
          
          # 复制模型文件
          if [ -d "saved_model" ]; then
            cp -r saved_model/* output/models/ 2>/dev/null || echo "没有模型文件"
          fi
          
          # 复制配置文件
          if [ -f "vocab.json" ]; then
            cp vocab.json output/
          fi
          
          if [ -f "saved_model/config.json" ]; then
            cp saved_model/config.json output/
          fi
          
          # 创建说明文件
          cat > output/README.md << 'EOF'
          # 训练输出文件
          
          ## 模型文件
          - `models/pretrain_final/` - 预训练模型
          - `models/sft_final/` - SFT微调模型
          - `models/rl_final/` - DPO强化学习模型
          
          ## 配置文件
          - `vocab.json` - 词汇表
          - `config.json` - 模型配置
          
          ## 预测结果
          - `predictions/` - 预测测试结果
          
          ## 使用说明
          下载模型后，可以使用 predict.py 进行文本生成：
          
          ### 使用SFT模型
          ```bash
          python predict.py --model_path models/sft_final --prompt "你的提示词"
          ```
          
          ### 使用RL模型
          ```bash
          python predict.py --model_path models/rl_final --prompt "你的提示词" --temperature 0.9
          ```
          
          ### 交互模式
          ```bash
          python predict.py --interactive --model_path models/sft_final
          ```
          EOF
          
          # 显示output目录内容
          echo "Output目录内容:"
          ls -la output/
          find output/ -type f | head -30

      # 13. 上传生成的模型文件和预测结果
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-with-predictions
          path: |
            output/
            saved_model/
            vocab.json
            saved_model/config.json
            generated_results.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          
      # 14. 上传训练日志
      - name: Upload logs
        if: always()  # 即使训练失败也上传日志
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: |
            *.log
            *.txt
            saved_model/*.log
            output/logs/
          if-no-files-found: ignore
          retention-days: 7

      # 15. 显示磁盘使用情况
      - name: Show disk usage
        if: always()
        run: |
          echo "磁盘使用情况:"
          df -h
          echo "模型目录大小:"
          du -sh saved_model/ 2>/dev/null || echo "没有模型目录"
          echo "输出目录大小:"
          du -sh output/ 2>/dev/null || echo "没有输出目录"
          
      # 16. 显示预测结果摘要
      - name: Show prediction summary
        if: always()
        run: |
          echo "========================================="
          echo "预测结果摘要"
          echo "========================================="
          
          if [ -d "output/predictions" ]; then
            echo "预测结果已保存到 output/predictions/"
            ls -la output/predictions/
          fi
          
          echo "========================================="
          echo "✅ 训练和预测流程完成！"
          echo "========================================="